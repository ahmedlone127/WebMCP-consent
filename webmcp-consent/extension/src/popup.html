<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebMCP Consent</title>
<style>
  :root{
    --ink:#171C23;--ink-2:#5A6472;--ink-3:#8C97A5;--line:#D5DCE4;--line-2:#E7ECF1;
    --surface:#fff;--bg:#EDF0F3;--accent:#B4690E;--accent-bg:#FDF4E5;--ok:#0F6D68;--danger:#A32626;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{width:380px;margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,sans-serif}
  header{padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
  .brand{font-weight:650;font-size:13px}
  .brand span{color:var(--ink-3);font-weight:400;margin-left:6px;font-size:11px}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--surface)}
  .tab{flex:1;padding:8px 0;text-align:center;font-size:11.5px;color:var(--ink-2);cursor:pointer;
    border-bottom:2px solid transparent}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  #list, #allowed{padding:10px 12px;max-height:420px;overflow-y:auto}
  .empty{color:var(--ink-3);text-align:center;padding:28px 0;font-size:12.5px}
  .card{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--accent-bg);
    border-radius:4px;padding:10px 12px;margin-bottom:10px}
  .card-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
  .tool{font-weight:650;font-size:12.5px}
  .score{font:10px var(--mono);padding:1px 6px;border-radius:9px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink-2)}
  .score.hi{color:var(--danger);border-color:#E5C0C0}
  .site{font-size:10.5px;color:var(--ink-2);margin-bottom:6px;word-break:break-all}
  .desc{font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
  .input{font:10.5px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);
    border-radius:3px;padding:6px 8px;margin-bottom:8px;white-space:pre-wrap;word-break:break-all}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  button{font:12px inherit;padding:5px 11px;border:1px solid var(--line);border-radius:3px;
    background:var(--surface);color:inherit;cursor:pointer}
  button:hover{border-color:var(--ink-3)}
  .ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .no{border-color:var(--danger);color:var(--danger)}
  .allow-row{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 0;border-bottom:1px solid var(--line-2)}
  .allow-row:last-child{border-bottom:0}
  .allow-name{font-size:12px;font-weight:600}
  .allow-site{font-size:10.5px;color:var(--ink-2)}
  footer{padding:8px 14px;font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--line-2);
    background:var(--surface)}
</style>
</head>
<body>
<header><span class="brand">WebMCP Consent<span>agent-side</span></span></header>
<div class="tabs">
  <div class="tab active" data-tab="pending">Pending</div>
  <div class="tab" data-tab="allowed">Always Allowed</div>
</div>
<div id="list"><div class="empty">Nothing waiting on you.</div></div>
<div id="allowed" style="display:none"><div class="empty">Nothing whitelisted yet.</div></div>
<footer>Reads run on any site automatically. Writes stop here first — even on sites that never added a consent layer of their own.</footer>
<script src="popup.js"></script>
</body>
</html>
